<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradOne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="animalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="500" height="340" rx="16" fill="url(#bgGradOne)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="230" height="28" rx="14" fill="#062e2b" opacity="0.9"/>
  <text x="139" y="38" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ONE HEALTH vs AMR INDONESIA</text>

  <!-- Connector line between the three pillars -->
  <line x1="137" y1="130" x2="210" y2="130" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="290" y1="130" x2="362" y2="130" stroke="#475569" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Pillar 1: human health -->
  <g>
    <circle cx="97" cy="130" r="40" fill="url(#humanGrad)"/>
    <text x="97" y="128" text-anchor="middle" font-size="22">🧑‍⚕️</text>
    <text x="97" y="152" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MANUSIA</text>
    <rect x="22" y="196" width="150" height="34" rx="8" fill="#0c4a6e"/>
    <text x="97" y="212" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9">Rumah sakit • lab AMR</text>
    <text x="97" y="224" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9">pemantauan pasien</text>
  </g>

  <!-- Pillar 2: animal health -->
  <g>
    <circle cx="250" cy="130" r="40" fill="url(#animalGrad)"/>
    <text x="250" y="128" text-anchor="middle" font-size="22">🐄</text>
    <text x="250" y="152" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">HEWAN</text>
    <rect x="175" y="196" width="150" height="34" rx="8" fill="#78350f"/>
    <text x="250" y="212" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9">Peternakan • perikanan</text>
    <text x="250" y="224" text-anchor="middle" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9">dokter hewan</text>
  </g>

  <!-- Pillar 3: environment -->
  <g>
    <circle cx="403" cy="130" r="40" fill="url(#envGrad)"/>
    <text x="403" y="128" text-anchor="middle" font-size="22">🌍</text>
    <text x="403" y="152" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">LINGKUNGAN</text>
    <rect x="328" y="196" width="150" height="34" rx="8" fill="#064e3b"/>
    <text x="403" y="212" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9">Air • tanah • pangan</text>
    <text x="403" y="224" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9">pertanian • UNEP</text>
  </g>

  <!-- TrACSS progress card (full width, bottom) -->
  <rect x="24" y="252" width="452" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="42" y="276" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">📊 TrACSS 2026</text>
  <text x="152" y="276" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">survei self-assessment AMR — WHO • FAO • UNEP • WOAH</text>
  <rect x="42" y="288" width="260" height="10" rx="5" fill="#334155"/>
  <rect x="42" y="288" width="214" height="10" rx="5" fill="#818cf8"/>
  <text x="318" y="298" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">✅ dikirim 12 Juni 2026</text>
</svg>
