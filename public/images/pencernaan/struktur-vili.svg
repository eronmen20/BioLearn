<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="villusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="softShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad3)" />

  <!-- Title Badge -->
  <g transform="translate(40, 30)">
    <rect width="360" height="36" rx="10" fill="#6c5ce7" fill-opacity="0.1" stroke="#6c5ce7" stroke-width="1.5" />
    <text x="15" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4834d4">
      🔬 Mikroanatomi Vili Usus &amp; Jaringan ENS / GALT
    </text>
  </g>

  <!-- Left: Single Villus Anatomy Magnified -->
  <g transform="translate(60, 80)">
    <rect width="380" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow3)" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e293b">Penampang Longitudinal Vili Usus</text>

    <!-- Finger-like Villus Body -->
    <path d="M 120 340 L 120 180 C 120 100 160 80 190 80 C 220 80 260 100 260 180 L 260 340 Z" fill="url(#villusGrad)" stroke="#fb923c" stroke-width="2" />

    <!-- Brush Border (Microvilli carpet along outer epithelium) -->
    <path d="M 115 180 C 115 95 155 75 190 75 C 225 75 265 95 265 180" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="2 3" />

    <!-- Central Lacteal (Green lymphatic vessel) -->
    <path d="M 183 340 L 183 140 C 183 125 197 125 197 140 L 197 340 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" />
    <text x="175" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">Lakteal</text>

    <!-- Capillary Network (Red Artery & Blue Vein Loop) -->
    <path d="M 150 340 L 150 160 C 150 135 180 130 180 150" fill="none" stroke="#ef4444" stroke-width="2.5" />
    <path d="M 230 340 L 230 160 C 230 135 200 130 200 150" fill="none" stroke="#3b82f6" stroke-width="2.5" />
    <!-- Capillary connecting mesh -->
    <line x1="150" y1="200" x2="183" y2="200" stroke="#ef4444" stroke-width="1.5" />
    <line x1="197" y1="200" x2="230" y2="200" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="150" y1="250" x2="183" y2="250" stroke="#ef4444" stroke-width="1.5" />
    <line x1="197" y1="250" x2="230" y2="250" stroke="#3b82f6" stroke-width="1.5" />
  </g>

  <!-- Right: Enteric Nervous System & Peyer's Patches -->
  <g transform="translate(470, 80)">
    <rect width="280" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow3)" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e293b">ENS &amp; Imunitas GALT</text>

    <!-- Auerbach & Meissner Plexus Node Box -->
    <g transform="translate(20, 60)">
      <rect width="240" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">Pleksus Auerbach (ENS)</text>
      <!-- Neuron Network diagram -->
      <circle cx="40" cy="65" r="8" fill="#3b82f6" />
      <circle cx="90" cy="55" r="8" fill="#3b82f6" />
      <circle cx="140" cy="75" r="8" fill="#3b82f6" />
      <circle cx="190" cy="60" r="8" fill="#3b82f6" />
      <line x1="40" y1="65" x2="90" y2="55" stroke="#60a5fa" stroke-width="2" />
      <line x1="90" y1="55" x2="140" y2="75" stroke="#60a5fa" stroke-width="2" />
      <line x1="140" y1="75" x2="190" y2="60" stroke="#60a5fa" stroke-width="2" />
      <text x="15" y="105" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e40af">Mengatur Peristaltik Otot Sirkuler &amp; Longitudinal</text>
    </g>

    <!-- Peyer's Patches Box -->
    <g transform="translate(20, 215)">
      <rect width="240" height="130" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7e22ce">Plak Peyer (Nodul Limfoid)</text>
      <!-- Lymphoid Follicles -->
      <circle cx="50" cy="65" r="14" fill="#d8b4fe" stroke="#9333ea" stroke-width="1.5" />
      <circle cx="85" cy="65" r="14" fill="#d8b4fe" stroke="#9333ea" stroke-width="1.5" />
      <circle cx="120" cy="65" r="14" fill="#d8b4fe" stroke="#9333ea" stroke-width="1.5" />
      <text x="145" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6b21a8">Sel M &amp; IgA</text>
      <text x="15" y="105" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6b21a8">Sistem Imun Mukosa Proteksi Bakteri</text>
    </g>
  </g>

  <!-- Dot 1: Mikrovili Brush Border (x: 23%, y: 22%) -->
  <g transform="translate(185, 110)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow3)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">1</text>
  </g>

  <!-- Dot 2: Lakteal Limfe (x: 31%, y: 50%) -->
  <g transform="translate(250, 250)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow3)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">2</text>
  </g>

  <!-- Dot 3: Pleksus Auerbach ENS (x: 75%, y: 38%) -->
  <g transform="translate(600, 190)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow3)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">3</text>
  </g>

  <!-- Dot 4: Plak Peyer GALT (x: 75%, y: 70%) -->
  <g transform="translate(600, 350)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow3)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">4</text>
  </g>
</svg>