<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-label="Animasi Saluran Pencernaan Atas & Gerak Peristaltik">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bolusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <style>
      @keyframes swallowBolus {
        0% { transform: translate(100px, 115px) scale(0.85); opacity: 0; }
        6% { opacity: 1; }
        25% { transform: translate(220px, 130px) scale(1.05); }
        38% { transform: translate(265px, 185px) scale(1); }
        60% { transform: translate(265px, 290px) scale(0.98); }
        85% { transform: translate(265px, 395px) scale(0.95); }
        95% { transform: translate(300px, 435px) scale(0.9); opacity: 1; }
        100% { transform: translate(335px, 445px) scale(0.8); opacity: 0; }
      }
      @keyframes flapEpiglottis {
        0%, 15% { transform: rotate(0deg); }
        30%, 48% { transform: rotate(44deg); }
        65%, 100% { transform: rotate(0deg); }
      }
      @keyframes peristalsisWave1 {
        0%, 100% { stroke-width: 9px; stroke: #e2e8f0; }
        30% { stroke-width: 17px; stroke: #10b981; }
      }
      @keyframes peristalsisWave2 {
        0%, 100% { stroke-width: 9px; stroke: #e2e8f0; }
        55% { stroke-width: 17px; stroke: #10b981; }
      }
      @keyframes peristalsisWave3 {
        0%, 100% { stroke-width: 9px; stroke: #e2e8f0; }
        78% { stroke-width: 17px; stroke: #10b981; }
      }
      .bolus-anim {
        animation: swallowBolus 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .epiglottis-anim {
        transform-origin: 245px 172px;
        animation: flapEpiglottis 5.5s ease-in-out infinite;
      }
      .wave-seg1 { animation: peristalsisWave1 5.5s infinite; }
      .wave-seg2 { animation: peristalsisWave2 5.5s infinite; }
      .wave-seg3 { animation: peristalsisWave3 5.5s infinite; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(28, 18)">
    <rect width="455" height="34" rx="8" fill="#10b981" fill-opacity="0.12"/>
    <text x="14" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#047857">
      MEKANISME PENCERNAAN ATAS &amp; DEGLUTISI (MENELAN)
    </text>
    <text x="480" y="22" class="font-sans" font-size="12" font-weight="600" fill="#64748b">
      Dari Mastikasi Mulut hingga Bolus Mencapai Lambung
    </text>
  </g>

  <!-- ================= LEFT HALF: Large Anatomical Cross-Section ================= -->
  <g id="anatomy" transform="translate(28, 62)">
    <!-- Outer Card Frame -->
    <rect width="430" height="456" rx="16" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="430" height="32" rx="16" fill="#f0fdf4"/>
    <text x="16" y="21" class="font-sans" font-size="12" font-weight="800" fill="#047857">
      SIMULASI ANATOMIS JALUR DEGLUTISI
    </text>

    <!-- Head profile silhouette hint -->
    <path d="M 50 60 Q 155 20 235 60 Q 275 80 295 120" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="5,5"/>

    <!-- Oral Cavity & Esophagus Outer Path -->
    <path d="M 80 120 C 135 110 200 115 242 135 C 262 145 272 165 272 190 L 272 415" fill="none" stroke="#fecdd3" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lumen interior (White passage) -->
    <path d="M 80 120 C 135 110 200 115 242 135 C 262 145 272 165 272 190 L 272 415" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Trachea (Tenggorokan Udara, di bagian DEPAN) -->
    <path d="M 245 190 C 240 215 225 270 220 360" fill="none" stroke="#bae6fd" stroke-width="26" stroke-linecap="round"/>
    <path d="M 245 190 C 240 215 225 270 220 360" fill="none" stroke="#f0f9ff" stroke-width="16" stroke-linecap="round"/>
    <!-- Cartilage Rings on Trachea -->
    <line x1="222" y1="230" x2="246" y2="230" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="220" y1="260" x2="244" y2="260" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="218" y1="290" x2="242" y2="290" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="216" y1="320" x2="240" y2="320" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <!-- Trachea Callout Pill -->
    <g transform="translate(115, 335)">
      <rect width="90" height="24" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="45" y="16" class="font-sans" font-size="9.5" font-weight="800" fill="#0369a1" text-anchor="middle">
        TRAKEA (Udara)
      </text>
    </g>

    <!-- Tongue (Lidah) -->
    <path d="M 105 145 C 140 145 195 145 230 151 C 220 167 170 167 120 159 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2"/>
    <text x="165" y="159" class="font-sans" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">LIDAH</text>

    <!-- Teeth (Gigi Kunyah) -->
    <rect x="85" y="108" width="10" height="12" rx="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
    <rect x="87" y="132" width="10" height="12" rx="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>

    <!-- Salivary Glands representation -->
    <ellipse cx="205" cy="100" rx="14" ry="9" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="205" y="86" class="font-sans" font-size="9" font-weight="700" fill="#854d0e" text-anchor="middle">Kelenjar Saliva</text>

    <!-- EPIGLOTTIS (Animated Cartilaginous Valve) -->
    <g class="epiglottis-anim">
      <!-- Flap body -->
      <path d="M 245 172 Q 238 192 234 212" fill="none" stroke="#dc2626" stroke-width="7.5" stroke-linecap="round"/>
      <circle cx="245" cy="172" r="4.5" fill="#991b1b"/>
    </g>
    <!-- Epiglottis Indicator Label -->
    <g transform="translate(145, 185)">
      <rect width="84" height="22" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="42" y="15" class="font-sans" font-size="9.5" font-weight="800" fill="#b91c1c" text-anchor="middle">
        Katup Epiglotis
      </text>
    </g>

    <!-- Esophageal Peristaltic Wave Muscle Rings -->
    <!-- Segment 1: Upper Esophagus -->
    <path d="M 251 205 L 251 250 M 293 205 L 293 250" fill="none" class="wave-seg1" stroke-linecap="round"/>
    <!-- Segment 2: Mid Esophagus -->
    <path d="M 251 270 L 251 320 M 293 270 L 293 320" fill="none" class="wave-seg2" stroke-linecap="round"/>
    <!-- Segment 3: Lower Esophagus -->
    <path d="M 251 340 L 251 390 M 293 340 L 293 390" fill="none" class="wave-seg3" stroke-linecap="round"/>

    <!-- Esophagus Label Pill -->
    <g transform="translate(305, 290)">
      <rect width="112" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="56" y="16" class="font-sans" font-size="9.5" font-weight="800" fill="#047857" text-anchor="middle">
        ESOFAGUS (Otot)
      </text>
    </g>

    <!-- Lower Esophageal Sphincter (LES) -->
    <ellipse cx="272" cy="410" rx="20" ry="6.5" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="4,3"/>
    <g transform="translate(170, 400)">
      <rect width="90" height="22" rx="5" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="45" y="15" class="font-sans" font-size="9.5" font-weight="800" fill="#be123c" text-anchor="middle">
        Sfingter LES
      </text>
    </g>

    <!-- Stomach Entrance -->
    <path d="M 258 418 C 253 450 278 472 335 468 C 360 464 374 442 360 418" fill="#fecdd3" fill-opacity="0.85" stroke="#e11d48" stroke-width="2"/>
    <text x="315" y="445" class="font-sans" font-size="11" font-weight="800" fill="#9f1239">LAMBUNG</text>

    <!-- ANIMATED FOOD BOLUS -->
    <g class="bolus-anim">
      <circle cx="0" cy="0" r="14" fill="url(#bolusGrad)" filter="url(#shadow)"/>
      <circle cx="-3" cy="-3" r="4" fill="#fef08a" opacity="0.9"/>
      <text x="0" y="3.5" class="font-sans" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">BOLUS</text>
    </g>
  </g>

  <!-- ================= RIGHT HALF: High-Contrast Explanatory Cards ================= -->
  <g transform="translate(480, 62)">

    <!-- Step 1 Card: Mastikasi & Enzim Ptialin -->
    <g transform="translate(0, 0)">
      <rect width="452" height="104" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" filter="url(#shadow)"/>
      <rect x="0" y="0" width="8" height="104" rx="4" fill="#f59e0b"/>
      <circle cx="34" cy="52" r="16" fill="#fef3c7"/>
      <text x="34" y="57" class="font-sans" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">1</text>
      
      <text x="62" y="27" class="font-sans" font-size="13" font-weight="800" fill="#1e293b">Mastikasi &amp; Enzim Ptialin Mulut</text>
      <text x="62" y="48" class="font-sans" font-size="11" fill="#475569">Gigi mencacah mekanik &amp; lidah memilin makanan.</text>
      <text x="62" y="66" class="font-sans" font-size="11" fill="#475569">Kelenjar saliva menghasilkan enzim ptialin (amilase).</text>
      <text x="62" y="85" class="font-sans" font-size="11" font-weight="700" fill="#d97706">Reaksi: Amilum matang dipecah jadi maltosa.</text>
    </g>

    <!-- Step 2 Card: Refleks Katup Epiglotis -->
    <g transform="translate(0, 114)">
      <rect width="452" height="104" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" filter="url(#shadow)"/>
      <rect x="0" y="0" width="8" height="104" rx="4" fill="#ef4444"/>
      <circle cx="34" cy="52" r="16" fill="#fee2e2"/>
      <text x="34" y="57" class="font-sans" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">2</text>
      
      <text x="62" y="27" class="font-sans" font-size="13" font-weight="800" fill="#1e293b">Refleks Deglutisi &amp; Katup Epiglotis</text>
      <text x="62" y="48" class="font-sans" font-size="11" fill="#475569">Saat bolus tiba di faring, terpicu refleks menelan.</text>
      <text x="62" y="66" class="font-sans" font-size="11" fill="#475569">Katup epiglotis otomatis menutup pintu laring/trakea.</text>
      <text x="62" y="85" class="font-sans" font-size="11" font-weight="700" fill="#dc2626">Mencegah bolus tersedak masuk saluran napas!</text>
    </g>

    <!-- Step 3 Card: Gelombang Peristaltik Esofagus -->
    <g transform="translate(0, 228)">
      <rect width="452" height="108" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" filter="url(#shadow)"/>
      <rect x="0" y="0" width="8" height="108" rx="4" fill="#10b981"/>
      <circle cx="34" cy="54" r="16" fill="#d1fae5"/>
      <text x="34" y="59" class="font-sans" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">3</text>
      
      <text x="62" y="27" class="font-sans" font-size="13" font-weight="800" fill="#1e293b">Gelombang Peristaltik Esofagus</text>
      <text x="62" y="48" class="font-sans" font-size="11" fill="#475569">Otot sirkuler memeras di belakang bolus makanan,</text>
      <text x="62" y="66" class="font-sans" font-size="11" fill="#475569">otot longitudinal membuka jalan di depannya.</text>
      <text x="62" y="86" class="font-sans" font-size="11" font-weight="700" fill="#059669">Pompa aktif neuromuskular — bekerja walau terbalik!</text>
    </g>

    <!-- Step 4 Card: Lower Esophageal Sphincter (LES) -->
    <g transform="translate(0, 346)">
      <rect width="452" height="110" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6" filter="url(#shadow)"/>
      <rect x="0" y="0" width="8" height="110" rx="4" fill="#6366f1"/>
      <circle cx="34" cy="55" r="16" fill="#e0e7ff"/>
      <text x="34" y="60" class="font-sans" font-size="15" font-weight="900" fill="#4338ca" text-anchor="middle">4</text>
      
      <text x="62" y="27" class="font-sans" font-size="13" font-weight="800" fill="#1e293b">Sfingter Esofagus Bawah (LES) &amp; Lambung</text>
      <text x="62" y="48" class="font-sans" font-size="11" fill="#475569">Cincin sfingter LES membuka meloloskan bolus,</text>
      <text x="62" y="66" class="font-sans" font-size="11" fill="#475569">lalu segera mengunci rapat dengan tonus tinggi.</text>
      <text x="62" y="86" class="font-sans" font-size="11" font-weight="700" fill="#4f46e5">Mencegah regurgitasi asam lambung (Pencegah GERD).</text>
    </g>
  </g>
</svg>