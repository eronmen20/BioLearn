<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="stomachWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <filter id="softShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad2)" />

  <!-- Title Badge -->
  <g transform="translate(40, 30)">
    <rect width="360" height="36" rx="10" fill="#6c5ce7" fill-opacity="0.1" stroke="#6c5ce7" stroke-width="1.5" />
    <text x="15" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4834d4">
      🧪 Fisiologi Kelenjar Gastrik &amp; Kelenjar Aksesori
    </text>
  </g>

  <!-- Left: Gastric Pit (Foveola Gastrika) Diagram -->
  <g transform="translate(50, 80)">
    <rect width="330" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow2)" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e293b">Mukosa &amp; Foveola Gastrika Lambung</text>

    <!-- Gastric Pit Tube Shape -->
    <path d="M 60 70 L 110 70 C 130 110 130 180 135 240 C 140 300 150 330 165 330 C 180 330 190 300 195 240 C 200 180 200 110 220 70 L 270 70 L 270 350 L 60 350 Z" fill="url(#stomachWall)" stroke="#f43f5e" stroke-width="2" />
    <path d="M 110 70 C 130 110 130 180 135 240 C 140 300 150 330 165 330 C 180 330 190 300 195 240 C 200 180 200 110 220 70" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />

    <!-- Parietal Cell (Fried egg appearance, produces HCl) -->
    <g transform="translate(85, 175)">
      <circle r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
      <circle r="7" fill="#b45309" />
      <text x="22" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400e">Sel Parietal (HCl + IF)</text>
    </g>

    <!-- Chief Cell (Basophilic, produces pepsinogen) -->
    <g transform="translate(95, 275)">
      <circle r="15" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
      <circle r="6" fill="#1d4ed8" />
      <text x="22" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af">Sel Chief (Pepsinogen)</text>
    </g>
  </g>

  <!-- Right: Pancreas & Liver Accessory Organs -->
  <g transform="translate(420, 80)">
    <rect width="330" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow2)" />
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e293b">Pankreas &amp; Kantung Empedu (Hati)</text>

    <!-- Pancreas Asinus Cells Structure -->
    <g transform="translate(40, 80)">
      <rect width="250" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#047857">Asinus Pankreas Eksokrin</text>
      <!-- Zymogen Granules -->
      <circle cx="40" cy="65" r="14" fill="#34d399" />
      <circle cx="75" cy="65" r="14" fill="#34d399" />
      <circle cx="110" cy="65" r="14" fill="#34d399" />
      <text x="135" y="62" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#065f46">Tripsinogen, Amilase,</text>
      <text x="135" y="78" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#065f46">Lipase &amp; NaHCO₃</text>
    </g>

    <!-- Gallbladder / Bile Salts Structure -->
    <g transform="translate(40, 220)">
      <rect width="250" height="110" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#a16207">Cairan Empedu (Garam Empedu)</text>
      <!-- Micelle Illustration -->
      <circle cx="50" cy="68" r="20" fill="#fde047" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3 3" />
      <text x="44" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#713f12">Lipid</text>
      <text x="85" y="62" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#854d0e">Emulsifikasi Lemak</text>
      <text x="85" y="78" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#854d0e">Membentuk Misel Halus</text>
    </g>
  </g>

  <!-- Dot 1: Sel Parietal (x: 23%, y: 45%) -->
  <g transform="translate(185, 225)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow2)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">1</text>
  </g>

  <!-- Dot 2: Sel Chief (x: 23%, y: 65%) -->
  <g transform="translate(185, 325)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow2)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">2</text>
  </g>

  <!-- Dot 3: Sel Asinus Pankreas (x: 75%, y: 35%) -->
  <g transform="translate(600, 175)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow2)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">3</text>
  </g>

  <!-- Dot 4: Garam Empedu (x: 75%, y: 65%) -->
  <g transform="translate(600, 325)">
    <circle r="14" fill="#6c5ce7" stroke="#ffffff" stroke-width="3" filter="url(#softShadow2)" />
    <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">4</text>
  </g>
</svg>