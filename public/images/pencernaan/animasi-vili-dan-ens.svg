<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-label="Mikroanatomi Vili Usus dan Regulasi Saraf Enterik">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <style>
      @keyframes absorbGlucose {
        0% { transform: translate(75px, 80px); opacity: 0; }
        25% { opacity: 1; }
        65% { transform: translate(120px, 205px); opacity: 1; }
        100% { transform: translate(140px, 335px); opacity: 0; }
      }
      @keyframes absorbLipid {
        0% { transform: translate(195px, 75px); opacity: 0; }
        25% { opacity: 1; }
        65% { transform: translate(165px, 200px); opacity: 1; }
        100% { transform: translate(165px, 350px); opacity: 0; }
      }
      @keyframes ensPulse {
        0%, 100% { stroke: #a855f7; stroke-width: 2.5px; }
        50% { stroke: #ec4899; stroke-width: 5px; filter: drop-shadow(0 0 5px #ec4899); }
      }
      .glucose-flow { animation: absorbGlucose 3.5s ease-in-out infinite; }
      .lipid-flow { animation: absorbLipid 4s 0.8s ease-in-out infinite; }
      .ens-nerve { animation: ensPulse 2s ease-in-out infinite; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" rx="20" fill="url(#bgGrad3)" stroke="#e9d5ff" stroke-width="2"/>

  <!-- Top Title Badge -->
  <g transform="translate(28, 18)">
    <rect width="520" height="34" rx="8" fill="#a855f7" fill-opacity="0.12"/>
    <text x="14" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#7e22ce">
      MIKROANATOMI VILI USUS &amp; KOORDINASI SARAF ENTERIK (ENS)
    </text>
    <text x="545" y="22" class="font-sans" font-size="12" font-weight="600" fill="#64748b">
      Integrasi Penyerapan Nutrisi &amp; Respons Stimulus Organ
    </text>
  </g>

  <!-- ================= LEFT COLUMN: Single Villus Architecture ================= -->
  <g transform="translate(28, 62)">
    <rect width="430" height="456" rx="16" fill="#ffffff" stroke="#f0abfc" stroke-width="1.8" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="430" height="32" rx="16" fill="#fdf4ff"/>
    <text x="16" y="21" class="font-sans" font-size="12" font-weight="800" fill="#a21caf">
      PENAMPANG MIKROSKOPIS 1 JONJOT VILI USUS
    </text>

    <!-- Outer Columnar Epithelium -->
    <path d="M 85 410 L 85 160 C 85 75 245 75 245 160 L 245 410" fill="#fdf2f8" stroke="#f472b6" stroke-width="5"/>
    <!-- Microvilli Brush Border Fringe -->
    <path d="M 78 160 C 78 66 252 66 252 160" fill="none" stroke="#db2777" stroke-width="3.5" stroke-dasharray="3,4"/>

    <!-- Central Lacteal (Pembuluh Kil Limfe - Hijau) -->
    <path d="M 152 410 L 152 175 C 152 140 178 140 178 175 L 178 410 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
    <text x="165" y="375" class="font-sans" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="middle">LAKTEAL</text>

    <!-- Blood Capillary Loops (Arteriole Merah & Venule Biru) -->
    <path d="M 112 410 L 112 185 C 112 152 140 152 140 185 L 140 410" fill="none" stroke="#ef4444" stroke-width="2.8"/>
    <path d="M 190 410 L 190 185 C 190 152 218 152 218 185 L 218 410" fill="none" stroke="#3b82f6" stroke-width="2.8"/>
    <!-- Capillary cross anastomoses -->
    <line x1="112" y1="210" x2="140" y2="210" stroke="#ef4444" stroke-width="2"/>
    <line x1="190" y1="210" x2="218" y2="210" stroke="#3b82f6" stroke-width="2"/>
    <line x1="140" y1="250" x2="190" y2="250" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="140" y1="300" x2="190" y2="300" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Microvilli Callout Banner (Top Right of Villus) -->
    <g transform="translate(262, 85)">
      <line x1="0" y1="10" x2="-22" y2="20" stroke="#db2777" stroke-width="1.8"/>
      <rect width="154" height="64" rx="8" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="10" y="18" class="font-sans" font-size="11" font-weight="800" fill="#be185d">Mikrovili Brush Border</text>
      <text x="10" y="34" class="font-sans" font-size="9.5" fill="#475569">~3.000 / sel epitel</text>
      <text x="10" y="50" class="font-sans" font-size="9.5" font-weight="700" fill="#9d174d">Luas serap usus ~200 m²</text>
    </g>

    <!-- Animated Nutrient Particles -->
    <g class="glucose-flow">
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <text x="9" y="4" class="font-sans" font-size="9.5" font-weight="800" fill="#b91c1c">Glukosa</text>
    </g>
    <g class="lipid-flow">
      <circle cx="0" cy="0" r="7" fill="#eab308"/>
      <text x="10" y="4" class="font-sans" font-size="9.5" font-weight="800" fill="#854d0e">Kilomikron</text>
    </g>

    <!-- Legend bottom pill -->
    <g transform="translate(16, 408)">
      <rect width="398" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="20" cy="17" r="5" fill="#ef4444"/>
      <text x="32" y="21" class="font-sans" font-size="10" font-weight="700" fill="#334155">
        Kapiler Darah: Glukosa &amp; Asam Amino
      </text>
      <circle cx="230" cy="17" r="5" fill="#22c55e"/>
      <text x="242" y="21" class="font-sans" font-size="10" font-weight="700" fill="#334155">
        Lakteal: Asam Lemak &amp; Kilomikron
      </text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: ENS & Stimulus Coordination ================= -->
  <g transform="translate(480, 62)">

    <!-- Top Card: 4 Wall Layers & ENS Card -->
    <g transform="translate(0, 0)">
      <rect width="452" height="176" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6" filter="url(#shadow3)"/>
      <rect x="0" y="0" width="8" height="176" rx="4" fill="#a855f7"/>
      <text x="20" y="24" class="font-sans" font-size="13" font-weight="800" fill="#6b21a8">
        4 Lapisan Dinding Usus &amp; Saraf Enterik (ENS)
      </text>

      <!-- 4 Layer Badges -->
      <g transform="translate(16, 36)">
        <!-- Mukosa -->
        <g transform="translate(0, 0)">
          <rect width="98" height="56" rx="8" fill="#fce7f3" stroke="#f472b6"/>
          <text x="49" y="20" class="font-sans" font-size="11" font-weight="800" fill="#9d174d" text-anchor="middle">Mukosa</text>
          <text x="49" y="36" class="font-sans" font-size="9" fill="#be185d" text-anchor="middle">Epitel, Jonjot</text>
          <text x="49" y="48" class="font-sans" font-size="8.5" fill="#be185d" text-anchor="middle">&amp; Vili Serap</text>
        </g>
        <!-- Submukosa -->
        <g transform="translate(106, 0)">
          <rect width="102" height="56" rx="8" fill="#f3e8ff" stroke="#c084fc"/>
          <text x="51" y="18" class="font-sans" font-size="11" font-weight="800" fill="#6b21a8" text-anchor="middle">Submukosa</text>
          <text x="51" y="33" class="font-sans" font-size="8.5" font-weight="700" fill="#9333ea" text-anchor="middle">Pl. Meissner</text>
          <text x="51" y="47" class="font-sans" font-size="8.5" fill="#7e22ce" text-anchor="middle">Kontrol Sekresi</text>
        </g>
        <!-- Muskularis -->
        <g transform="translate(216, 0)">
          <rect width="102" height="56" rx="8" fill="#fee2e2" stroke="#f87171"/>
          <text x="51" y="18" class="font-sans" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Muskularis</text>
          <text x="51" y="33" class="font-sans" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Pl. Auerbach</text>
          <text x="51" y="47" class="font-sans" font-size="8.5" fill="#b91c1c" text-anchor="middle">Otot Peristaltik</text>
        </g>
        <!-- Serosa -->
        <g transform="translate(326, 0)">
          <rect width="94" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
          <text x="47" y="20" class="font-sans" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">Serosa</text>
          <text x="47" y="36" class="font-sans" font-size="9" fill="#64748b" text-anchor="middle">Jaringan Ikat</text>
          <text x="47" y="48" class="font-sans" font-size="8.5" fill="#64748b" text-anchor="middle">Pelindung Luar</text>
        </g>
      </g>

      <!-- Pulsating ENS Nerve Wire -->
      <path d="M 40 120 C 110 110 170 132 230 118 C 290 106 350 132 410 118" fill="none" class="ens-nerve"/>
      <circle cx="140" cy="122" r="4.5" fill="#a855f7"/>
      <circle cx="280" cy="115" r="4.5" fill="#ec4899"/>
      
      <!-- Descriptions in 2 wrapped lines -->
      <text x="226" y="145" class="font-sans" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="middle">
        ⚡ ENS: 500+ Juta Neuron Otonom ("Otak Kedua Tubuh")
      </text>
      <text x="226" y="162" class="font-sans" font-size="10" fill="#6b21a8" text-anchor="middle">
        Mengatur gerakan peristaltik &amp; sekresi mandiri dari SSP.
      </text>
    </g>

    <!-- Bottom Card: Stimulus Response Coordination (CP Aligned) -->
    <g transform="translate(0, 190)">
      <rect width="452" height="266" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6" filter="url(#shadow3)"/>
      <rect x="0" y="0" width="8" height="266" rx="4" fill="#7e22ce"/>
      <text x="20" y="24" class="font-sans" font-size="12.5" font-weight="800" fill="#4a044e">
        Koordinasi Stimulus Internal &amp; Eksternal (CP Aligned)
      </text>

      <!-- Side-by-Side Stimulus Boxes -->
      <!-- Internal Stimulus Box -->
      <g transform="translate(16, 36)">
        <rect width="202" height="126" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1d4ed8">📥 Stimulus Internal</text>
        <text x="12" y="40" class="font-sans" font-size="10" fill="#1e40af">• Bolus meregangkan usus</text>
        <text x="12" y="56" class="font-sans" font-size="10" fill="#1e40af">• Keasaman asam kimus</text>
        <text x="12" y="72" class="font-sans" font-size="10" fill="#1e40af">• Pepton &amp; asam lemak</text>
        <rect x="8" y="86" width="186" height="30" rx="6" fill="#dbeafe"/>
        <text x="101" y="105" class="font-sans" font-size="9.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
          Refleks ENS &amp; Hormon CCK
        </text>
      </g>

      <!-- External Stimulus Box -->
      <g transform="translate(228, 36)">
        <rect width="206" height="126" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="12" y="20" class="font-sans" font-size="11" font-weight="800" fill="#c2410c">⚡ Stimulus Eksternal</text>
        <text x="12" y="40" class="font-sans" font-size="10" fill="#9a3412">• Stres emosional &amp; cemas</text>
        <text x="12" y="56" class="font-sans" font-size="10" fill="#9a3412">• Aroma visual makanan</text>
        <text x="12" y="72" class="font-sans" font-size="10" fill="#9a3412">• Suhu dingin lingkungan</text>
        <rect x="8" y="86" width="190" height="30" rx="6" fill="#ffedd5"/>
        <text x="103" y="105" class="font-sans" font-size="9.5" font-weight="800" fill="#7c2d12" text-anchor="middle">
          Sumbu Otak-Usus (N. Vagus)
        </text>
      </g>

      <!-- Colon & Microflora Banner (Cleanly wrapped in 3 lines) -->
      <g transform="translate(16, 174)">
        <rect width="418" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="14" y="20" class="font-sans" font-size="11" font-weight="800" fill="#166534">
          🦠 Peran Kolon (Usus Besar) &amp; Mikrobiota:
        </text>
        <text x="14" y="37" class="font-sans" font-size="9.5" fill="#15803d">
          • Reabsorpsi 90% air &amp; elektrolit sisa dari kimus cair.
        </text>
        <text x="14" y="52" class="font-sans" font-size="9.5" fill="#15803d">
          • Bakteri komensal mensintesis Vitamin K &amp; Biotin.
        </text>
        <text x="14" y="67" class="font-sans" font-size="9.5" font-weight="700" fill="#166534">
          • Keseimbangan flora mencegah infeksi bakteri patogen.
        </text>
      </g>
    </g>
  </g>
</svg>