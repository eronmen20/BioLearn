<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Struktur Virus Bakteriofag">
  <defs>
    <style>
      .lbl { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #2d3436; }
      .line { stroke: #636e72; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="520" height="400" fill="#ffffff" />
  <!-- Kepala (kapsid polihedral) -->
  <polygon points="260,60 320,90 320,150 260,180 200,150 200,90" fill="#ffeaa7" stroke="#0984e3" stroke-width="5"/>
  <!-- DNA di dalam kepala -->
  <path d="M225,105 q15,15 0,30 q-15,15 0,30 M260,100 q15,15 0,42 q-18,18 0,40 M295,105 q-15,15 0,30 q15,15 0,30"
        fill="none" stroke="#e17055" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ekor -->
  <rect x="252" y="180" width="16" height="90" fill="#fab1a0" stroke="#0984e3" stroke-width="4"/>
  <!-- Serabut ekor -->
  <path d="M252,270 L205,320 M260,270 L260,330 M268,270 L315,320" fill="none" stroke="#0984e3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lempeng dasar -->
  <rect x="240" y="262" width="40" height="10" fill="#74b9ff" stroke="#0984e3" stroke-width="3"/>
  <!-- Sel inang (OPSIONAL konkret) -->
  <rect x="60" y="330" width="400" height="55" rx="22" fill="#dfe6e9" stroke="#00b894" stroke-width="3"/>
  <text x="260" y="365" text-anchor="middle" class="lbl">Dinding sel inang (bakteri)</text>
  <!-- Label -->
  <text x="345" y="115" class="lbl">Kapsid (polihedral)</text>
  <line x1="320" y1="120" x2="340" y2="115" class="line"/>
  <text x="365" y="150" class="lbl">Asam nukleat (DNA)</text>
  <line x1="300" y1="140" x2="360" y2="146" class="line"/>
  <text x="350" y="212" class="lbl">Selubung ekor</text>
  <line x1="268" y1="220" x2="345" y2="210" class="line"/>
  <text x="355" y="255" class="lbl">Lempeng dasar</text>
  <line x1="280" y1="267" x2="350" y2="253" class="line"/>
  <text x="330" y="315" class="lbl">Serabut ekor</text>
  <line x1="278" y1="300" x2="325" y2="310" class="line"/>
</svg>
