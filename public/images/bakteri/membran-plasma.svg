<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="proteinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="500" height="340" rx="16" fill="url(#bgGrad3)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="165" height="28" rx="14" fill="#1e1b4b" opacity="0.8"/>
  <text x="106" y="38" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MEMBRAN PLASMA</text>

  <!-- Phospholipid Bilayer Cross Section -->
  <g transform="translate(40, 85)">
    <!-- Outside label -->
    <text x="210" y="0" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Sisi Luar Sel (Dinding Sel)</text>

    <!-- Top monolayer heads -->
    <g fill="#818cf8" stroke="#4f46e5" stroke-width="1.5">
      <circle cx="20" cy="25" r="9"/>
      <circle cx="45" cy="25" r="9"/>
      <circle cx="70" cy="25" r="9"/>
      <circle cx="95" cy="25" r="9"/>
      <!-- Protein channel gap -->
      <circle cx="215" cy="25" r="9"/>
      <circle cx="240" cy="25" r="9"/>
      <circle cx="265" cy="25" r="9"/>
      <!-- Carrier protein gap -->
      <circle cx="370" cy="25" r="9"/>
      <circle cx="395" cy="25" r="9"/>
    </g>

    <!-- Fatty acid tails (Top) -->
    <g stroke="#cbd5e1" stroke-width="2" fill="none">
      <path d="M 18,34 Q 15,50 18,65 M 22,34 Q 25,50 22,65"/>
      <path d="M 43,34 Q 40,50 43,65 M 47,34 Q 50,50 47,65"/>
      <path d="M 68,34 Q 65,50 68,65 M 72,34 Q 75,50 72,65"/>
      <path d="M 93,34 Q 90,50 93,65 M 97,34 Q 100,50 97,65"/>
      
      <path d="M 213,34 Q 210,50 213,65 M 217,34 Q 220,50 217,65"/>
      <path d="M 238,34 Q 235,50 238,65 M 242,34 Q 245,50 242,65"/>
      <path d="M 263,34 Q 260,50 263,65 M 267,34 Q 270,50 267,65"/>

      <path d="M 368,34 Q 365,50 368,65 M 372,34 Q 375,50 372,65"/>
      <path d="M 393,34 Q 390,50 393,65 M 397,34 Q 400,50 397,65"/>
    </g>

    <!-- Channel Integral Protein 1 -->
    <path d="M 120,15 C 110,40 110,80 120,115 L 140,115 C 130,80 130,40 140,15 Z" fill="url(#proteinGrad)" stroke="#0369a1" stroke-width="1.5"/>
    <path d="M 170,15 C 180,40 180,80 170,115 L 190,115 C 200,80 200,40 190,15 Z" fill="url(#proteinGrad)" stroke="#0369a1" stroke-width="1.5"/>
    <ellipse cx="155" cy="65" rx="8" ry="30" fill="#0c4a6e" opacity="0.6"/>
    <text x="155" y="68" text-anchor="middle" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">SALURAN</text>

    <!-- Transporter Protein 2 -->
    <rect x="295" y="10" width="55" height="110" rx="16" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <text x="322" y="68" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">ATP SINTASE</text>

    <!-- Fatty acid tails (Bottom) -->
    <g stroke="#cbd5e1" stroke-width="2" fill="none">
      <path d="M 18,96 Q 15,80 18,65 M 22,96 Q 25,80 22,65"/>
      <path d="M 43,96 Q 40,80 43,65 M 47,96 Q 50,80 47,65"/>
      <path d="M 68,96 Q 65,80 68,65 M 72,96 Q 75,80 72,65"/>
      <path d="M 93,96 Q 90,80 93,65 M 97,96 Q 100,80 97,65"/>
      
      <path d="M 213,96 Q 210,80 213,65 M 217,96 Q 220,80 217,65"/>
      <path d="M 238,96 Q 235,80 238,65 M 242,96 Q 245,80 242,65"/>
      <path d="M 263,96 Q 260,80 263,65 M 267,96 Q 270,80 267,65"/>

      <path d="M 368,96 Q 365,80 368,65 M 372,96 Q 375,80 372,65"/>
      <path d="M 393,96 Q 390,80 393,65 M 397,96 Q 400,80 397,65"/>
    </g>

    <!-- Bottom monolayer heads -->
    <g fill="#818cf8" stroke="#4f46e5" stroke-width="1.5">
      <circle cx="20" cy="105" r="9"/>
      <circle cx="45" cy="105" r="9"/>
      <circle cx="70" cy="105" r="9"/>
      <circle cx="95" cy="105" r="9"/>
      <circle cx="215" cy="105" r="9"/>
      <circle cx="240" cy="105" r="9"/>
      <circle cx="265" cy="105" r="9"/>
      <circle cx="370" cy="105" r="9"/>
      <circle cx="395" cy="105" r="9"/>
    </g>

    <!-- Inside label -->
    <text x="210" y="140" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Sisi Dalam Sel (Sitoplasma)</text>
  </g>

  <!-- Labels & Callouts -->
  <g transform="translate(45, 235)">
    <rect x="0" y="0" width="195" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Kepala Hidrofilik (Kutub)</text>
    <text x="12" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Menyukai air (menghadap luar/dalam)</text>

    <rect x="215" y="0" width="195" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="227" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Ekor Hidrofobik (Nonpolar)</text>
    <text x="227" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Asam lemak menolak air (di tengah)</text>
  </g>

  <!-- Bottom Info Callout -->
  <rect x="45" y="286" width="410" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="304" r="8" fill="#6366f1"/>
  <text x="65" y="308" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">⚡</text>
  <text x="83" y="301" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Peran Unik pada Bakteri:</text>
  <text x="83" y="314" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Tempat respirasi seluler &amp; sintesis ATP (pengganti peran mitokondria).</text>
</svg>
