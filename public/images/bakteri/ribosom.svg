<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sub50Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sub30Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="500" height="340" rx="16" fill="url(#bgGradRib)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="180" height="28" rx="14" fill="#7c2d12" opacity="0.8"/>
  <text x="114" y="38" text-anchor="middle" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RIBOSOM 70S PROKARIOT</text>

  <!-- Ribosome Complex (Subunit 50S + 30S) -->
  <g transform="translate(140, 65)">
    <!-- mRNA strand running through center -->
    <path d="M -60,110 C 20,95 80,125 150,110 S 260,105 320,115" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <text x="-40" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">mRNA 5' → 3'</text>

    <!-- Growing polypeptide protein chain -->
    <g fill="#ec4899" stroke="#db2777" stroke-width="1.5">
      <circle cx="100" cy="5" r="7"/>
      <circle cx="95" cy="-12" r="7"/>
      <circle cx="108" cy="-25" r="7"/>
      <circle cx="102" cy="-40" r="7"/>
      <text x="125" y="-30" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Rantai Polipeptida (Protein)</text>
    </g>

    <!-- 50S Large Subunit (Top, larger mass) -->
    <path d="M 30,80 C 15,20 60,15 100,15 C 150,15 200,25 190,80 C 170,95 140,90 110,88 C 80,88 50,95 30,80 Z" fill="url(#sub50Grad)" stroke="#c2410c" stroke-width="2"/>
    <text x="110" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="extrabold">Subunit 50S</text>
    <text x="110" y="70" text-anchor="middle" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="9">(23S + 5S rRNA + 31 protein)</text>

    <!-- 30S Small Subunit (Bottom, elongated) -->
    <path d="M 40,118 C 50,105 80,110 110,110 C 140,110 170,105 180,118 C 190,150 160,165 110,165 C 60,165 30,150 40,118 Z" fill="url(#sub30Grad)" stroke="#b45309" stroke-width="2"/>
    <text x="110" y="140" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="13" font-weight="extrabold">Subunit 30S</text>
    <text x="110" y="153" text-anchor="middle" fill="#92400e" font-family="system-ui, sans-serif" font-size="9">(16S rRNA + 21 protein)</text>
  </g>

  <!-- Total 70S Badge -->
  <rect x="350" y="90" width="115" height="55" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="407" y="112" text-anchor="middle" fill="#fb923c" font-family="system-ui, sans-serif" font-size="14" font-weight="extrabold">TOTAL = 70S</text>
  <text x="407" y="128" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">(Svedberg unit /</text>
  <text x="407" y="138" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">laju sedimentasi)</text>

  <!-- Bottom Info Callout -->
  <rect x="30" y="284" width="440" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="50" cy="303" r="8" fill="#ea580c"/>
  <text x="50" y="307" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">⚙️</text>
  <text x="68" y="300" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Fungsi Ribosom:</text>
  <text x="68" y="313" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Tempat translasi sintesis protein, target penting obat antibiotik (misal tetrasiklin).</text>
</svg>
