<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="500" height="340" rx="16" fill="url(#bgGradPil)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="180" height="28" rx="14" fill="#831843" opacity="0.8"/>
  <text x="114" y="38" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PILI &amp; FIMBRIAE</text>

  <!-- Two Bacterial Cells with Conjugation Bridge (Pilus Seks) -->
  <g transform="translate(40, 70)">
    <!-- Donor Cell (Left) -->
    <rect x="0" y="25" width="140" height="90" rx="45" fill="#1e1b4b" stroke="#6366f1" stroke-width="3"/>
    <text x="70" y="65" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Sel Donor (F+)</text>
    <!-- Plasmid in Donor -->
    <circle cx="100" cy="85" r="14" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <text x="100" y="88" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">F</text>

    <!-- Fimbriae on Donor (Short hair bristles) -->
    <g stroke="#ec4899" stroke-width="2" stroke-linecap="round">
      <line x1="20" y1="25" x2="10" y2="10"/>
      <line x1="50" y1="25" x2="45" y2="8"/>
      <line x1="90" y1="25" x2="95" y2="8"/>
      <line x1="120" y1="28" x2="135" y2="15"/>
      <line x1="20" y1="115" x2="10" y2="130"/>
      <line x1="60" y1="115" x2="55" y2="132"/>
      <line x1="100" y1="115" x2="105" y2="132"/>
    </g>

    <!-- Pilus Seks Bridge (Conjugation Tube) -->
    <rect x="140" y="62" width="140" height="16" rx="8" fill="#db2777" stroke="#f472b6" stroke-width="2"/>
    <text x="210" y="52" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Pilus Konjugasi (Seks)</text>
    <!-- DNA Strand Moving Across Bridge -->
    <path d="M 115,80 C 135,70 170,70 210,70 S 260,70 290,80" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="4,2"/>
    <polygon points="220,66 230,70 220,74" fill="#22d3ee"/>
    <text x="210" y="94" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="9">Transfer Salinan Plasmid</text>

    <!-- Recipient Cell (Right) -->
    <rect x="280" y="25" width="140" height="90" rx="45" fill="#1e1b4b" stroke="#10b981" stroke-width="3"/>
    <text x="350" y="65" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Sel Resipien (F-)</text>
    <text x="350" y="85" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Menerima gen baru</text>

    <!-- Fimbriae on Recipient -->
    <g stroke="#ec4899" stroke-width="2" stroke-linecap="round">
      <line x1="300" y1="25" x2="295" y2="10"/>
      <line x1="340" y1="25" x2="335" y2="8"/>
      <line x1="380" y1="25" x2="385" y2="8"/>
      <line x1="410" y1="35" x2="425" y2="25"/>
      <line x1="320" y1="115" x2="315" y2="132"/>
      <line x1="360" y1="115" x2="365" y2="132"/>
      <line x1="400" y1="115" x2="415" y2="130"/>
    </g>
  </g>

  <!-- Difference Summary Cards -->
  <g transform="translate(35, 215)">
    <rect x="0" y="0" width="205" height="52" rx="8" fill="#1e293b" stroke="#db2777" stroke-width="1"/>
    <text x="12" y="20" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Pilus (Sex Pilus)</text>
    <text x="12" y="36" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Jembatan transfer DNA plasmid (konjugasi)</text>
    <text x="12" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Jumlah sedikit (1-10 per sel), lebih panjang</text>

    <rect x="225" y="0" width="205" height="52" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="237" y="20" fill="#ec4899" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Fimbriae (Attachment)</text>
    <text x="237" y="36" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Pelekatan pada substrat / jaringan tubuh inang</text>
    <text x="237" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Jumlah banyak (ratusan per sel), lebih pendek</text>
  </g>

  <!-- Bottom Info Callout -->
  <rect x="35" y="284" width="430" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="303" r="8" fill="#db2777"/>
  <text x="55" y="307" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🔗</text>
  <text x="73" y="300" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Peran Utama:</text>
  <text x="73" y="313" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Fimbriae untuk penempelan (infeksi), Pilus untuk transfer sifat genetik antar-bakteri.</text>
</svg>
