<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradNuk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="500" height="340" rx="16" fill="url(#bgGradNuk)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="200" height="28" rx="14" fill="#581c87" opacity="0.8"/>
  <text x="124" y="38" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NUKLEOID (DNA SIRKULER)</text>

  <!-- Bacterial Outlines (Ghost) -->
  <rect x="60" y="70" width="380" height="190" rx="95" fill="#1e1b4b" stroke="#3730a3" stroke-width="2" opacity="0.4"/>
  <text x="75" y="95" fill="#6366f1" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Batas Sitoplasma Sel Bakteri</text>

  <!-- Nucleoid region (Halo glow) -->
  <ellipse cx="250" cy="165" rx="120" ry="70" fill="#a855f7" opacity="0.12"/>
  <ellipse cx="250" cy="165" rx="100" ry="55" fill="#ec4899" opacity="0.08"/>

  <!-- Tangled Circular Chromosomal DNA (Double helix loop) -->
  <g fill="none" stroke="url(#dnaGrad)" stroke-linecap="round">
    <!-- Strand 1 -->
    <path d="M 180,150 C 160,110 240,110 230,140 C 220,170 170,180 200,210 C 230,235 310,220 290,170 C 275,130 350,120 330,160 C 310,200 240,190 260,150 C 270,130 220,130 180,150 Z" stroke-width="4.5" stroke-dasharray="8,2"/>
    <!-- Strand 2 (Twisted) -->
    <path d="M 185,155 C 165,115 245,115 235,145 C 225,175 175,185 205,215 C 235,240 315,225 295,175 C 280,135 355,125 335,165 C 315,205 245,195 265,155 C 275,135 225,135 185,155 Z" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Key Pointers & Highlights -->
  <!-- Pointer: Tanpa membran inti -->
  <line x1="160" y1="130" x2="100" y2="105" stroke="#ec4899" stroke-width="1.5"/>
  <circle cx="160" cy="130" r="3.5" fill="#ec4899"/>
  <rect x="35" y="80" width="135" height="42" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="102" y="97" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Tanpa Membran Inti</text>
  <text x="102" y="112" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Kontak langsung sitoplasma</text>

  <!-- Pointer: DNA Sirkuler Tunggal -->
  <line x1="330" y1="180" x2="385" y2="195" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="330" cy="180" r="3.5" fill="#a855f7"/>
  <rect x="330" y="180" width="140" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="400" y="197" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">DNA Sirkuler Ganda</text>
  <text x="400" y="212" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Kromosom pembawa sifat</text>

  <!-- Bottom Info Callout -->
  <rect x="45" y="284" width="410" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="303" r="8" fill="#a855f7"/>
  <text x="65" y="307" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🧬</text>
  <text x="83" y="300" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Fungsi Nukleoid:</text>
  <text x="83" y="313" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Pusat kendali aktivitas metabolisme dan pewarisan informasi genetik bakteri.</text>
</svg>
