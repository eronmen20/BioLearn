<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="350" rx="16" fill="url(#bgGrad)"/>

  <!-- Title Badge (Top-Left) -->
  <rect x="25" y="18" width="160" height="26" rx="13" fill="#065f46" opacity="0.9"/>
  <text x="105" y="35" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STRUKTUR KAPSUL</text>

  <!-- Bacterial Layers Cross Section (Centered at x=280, y=160) -->
  <!-- 1. Outermost: Capsule (Glow & Outer Boundary) -->
  <rect x="130" y="85" width="300" height="150" rx="75" fill="none" stroke="url(#capsuleGrad)" stroke-width="24" opacity="0.45" filter="url(#glow)"/>
  <rect x="130" y="85" width="300" height="150" rx="75" fill="#047857" opacity="0.15" stroke="url(#capsuleGrad)" stroke-width="18"/>

  <!-- 2. Cell Wall -->
  <rect x="142" y="97" width="276" height="126" rx="63" fill="none" stroke="url(#wallGrad)" stroke-width="7"/>

  <!-- 3. Plasma Membrane -->
  <rect x="149" y="104" width="262" height="112" rx="56" fill="#1e1b4b" stroke="url(#memGrad)" stroke-width="3.5"/>

  <!-- Cytoplasm & internal hints -->
  <ellipse cx="280" cy="160" rx="105" ry="38" fill="#312e81" opacity="0.3"/>
  <!-- Nucleoid tangle in center -->
  <path d="M 245,155 Q 265,138 280,155 T 315,150 Q 305,172 275,165 T 255,160" fill="none" stroke="#a78bfa" stroke-width="2.5" opacity="0.7"/>

  <!-- Pointers & Callouts (Positioned safely with ample margins) -->
  
  <!-- Capsule Callout (Left side) -->
  <line x1="165" y1="85" x2="115" y2="60" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="165" cy="85" r="4" fill="#34d399"/>
  <rect x="25" y="52" width="135" height="38" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <text x="92" y="68" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">1. Kapsul / Lendir</text>
  <text x="92" y="82" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5">Lapisan terluar pelindung</text>

  <!-- Cell Wall Callout (Right side) -->
  <line x1="395" y1="102" x2="435" y2="78" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="395" cy="102" r="3.5" fill="#f59e0b"/>
  <rect x="425" y="62" width="110" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="480" y="78" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Dinding Sel</text>
  <text x="480" y="91" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Peptidoglikan</text>

  <!-- Plasma Membrane Callout (Right side lower) -->
  <line x1="400" y1="125" x2="435" y2="135" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="400" cy="125" r="3.5" fill="#818cf8"/>
  <rect x="425" y="120" width="115" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
  <text x="482" y="136" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Membran Plasma</text>
  <text x="482" y="149" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Fosfolipid bilayer</text>

  <!-- Bottom Info Callout -->
  <rect x="25" y="285" width="510" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="48" cy="306" r="9" fill="#10b981"/>
  <text x="48" y="310" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓</text>
  <text x="68" y="302" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Fungsi Utama Kapsul:</text>
  <text x="68" y="317" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Mencegah dehidrasi, membantu adhesi sel inang, &amp; melindungi dari fagositosis.</text>
</svg>
