<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPlas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="plasmidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="500" height="340" rx="16" fill="url(#bgGradPlas)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="180" height="28" rx="14" fill="#083344" opacity="0.8"/>
  <text x="114" y="38" text-anchor="middle" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PLASMID (DNA EKSTRA)</text>

  <!-- Large Plasmid Ring (Center) -->
  <g transform="translate(180, 70)">
    <!-- Outer Glow -->
    <circle cx="85" cy="85" r="70" fill="none" stroke="#06b6d4" stroke-width="12" opacity="0.2"/>
    <!-- Double-stranded DNA Ring -->
    <circle cx="85" cy="85" r="70" fill="none" stroke="url(#plasmidGrad)" stroke-width="8"/>
    <circle cx="85" cy="85" r="60" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6,3"/>

    <!-- Special Gene Segments on Plasmid -->
    <!-- Antibiotic Resistance Gene (Red/Orange segment) -->
    <path d="M 85,15 A 70,70 0 0,1 155,85" fill="none" stroke="#ef4444" stroke-width="10"/>
    <circle cx="128" cy="42" r="5" fill="#fca5a5"/>
    <text x="145" y="45" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Gen Resistensi (R)</text>

    <!-- Origin of Replication (Ori) -->
    <path d="M 15,85 A 70,70 0 0,1 85,155" fill="none" stroke="#10b981" stroke-width="10"/>
    <text x="40" y="140" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Ori (Replikasi)</text>

    <!-- Center Label -->
    <text x="85" y="82" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="extrabold">PLASMID</text>
    <text x="85" y="98" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Cincin DNA Mandiri</text>
  </g>

  <!-- Side comparison cards -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="125" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Karakteristik:</text>
    <text x="12" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">• Non-kromosomal</text>
    <text x="12" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">• Replikasi otonom</text>
    <text x="12" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">• Dapat ditransfer</text>
    <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">(lewat konjugasi)</text>
    <text x="12" y="112" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9">• Vektor rekayasa gen</text>
  </g>

  <!-- Bottom Info Callout -->
  <rect x="30" y="284" width="440" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="50" cy="303" r="8" fill="#06b6d4"/>
  <text x="50" y="307" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">💊</text>
  <text x="68" y="300" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Penting dalam Kedokteran &amp; Bioteknologi:</text>
  <text x="68" y="313" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Plasmid sering membawa gen kekebalan antibiotik dan dijadikan vektor kloning DNA.</text>
</svg>
