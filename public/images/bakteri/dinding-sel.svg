<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nagNamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="340" rx="16" fill="url(#bgGrad2)"/>

  <!-- Title Badge -->
  <rect x="24" y="20" width="170" height="28" rx="14" fill="#78350f" opacity="0.8"/>
  <text x="109" y="38" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DINDING SEL (MUREIN)</text>

  <!-- Peptidoglycan Mesh Visualization -->
  <!-- Glycan chains NAG - NAM -->
  <g transform="translate(40, 75)">
    <!-- Chain 1 -->
    <g transform="translate(0, 0)">
      <rect x="20" y="10" width="45" height="22" rx="6" fill="#f59e0b"/>
      <text x="42" y="25" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAG</text>
      <line x1="65" y1="21" x2="80" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="80" y="10" width="45" height="22" rx="6" fill="#ef4444"/>
      <text x="102" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAM</text>
      <line x1="125" y1="21" x2="140" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="140" y="10" width="45" height="22" rx="6" fill="#f59e0b"/>
      <text x="162" y="25" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAG</text>
      <line x1="185" y1="21" x2="200" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="200" y="10" width="45" height="22" rx="6" fill="#ef4444"/>
      <text x="222" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAM</text>
      <line x1="245" y1="21" x2="260" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="260" y="10" width="45" height="22" rx="6" fill="#f59e0b"/>
      <text x="282" y="25" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAG</text>
      <line x1="305" y1="21" x2="320" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="320" y="10" width="45" height="22" rx="6" fill="#ef4444"/>
      <text x="342" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAM</text>
    </g>

    <!-- Peptide Cross-links (Vertical) -->
    <g stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,3">
      <line x1="102" y1="32" x2="102" y2="80"/>
      <line x1="222" y1="32" x2="222" y2="80"/>
      <line x1="342" y1="32" x2="342" y2="80"/>
    </g>

    <!-- Chain 2 -->
    <g transform="translate(0, 70)">
      <rect x="20" y="10" width="45" height="22" rx="6" fill="#ef4444"/>
      <text x="42" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAM</text>
      <line x1="65" y1="21" x2="80" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="80" y="10" width="45" height="22" rx="6" fill="#f59e0b"/>
      <text x="102" y="25" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAG</text>
      <line x1="125" y1="21" x2="140" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="140" y="10" width="45" height="22" rx="6" fill="#ef4444"/>
      <text x="162" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAM</text>
      <line x1="185" y1="21" x2="200" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="200" y="10" width="45" height="22" rx="6" fill="#f59e0b"/>
      <text x="222" y="25" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAG</text>
      <line x1="245" y1="21" x2="260" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="260" y="10" width="45" height="22" rx="6" fill="#ef4444"/>
      <text x="282" y="25" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAM</text>
      <line x1="305" y1="21" x2="320" y2="21" stroke="#cbd5e1" stroke-width="3"/>
      <rect x="320" y="10" width="45" height="22" rx="6" fill="#f59e0b"/>
      <text x="342" y="25" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">NAG</text>
    </g>

    <!-- Crosslink peptide dots -->
    <circle cx="102" cy="56" r="4" fill="#38bdf8"/>
    <circle cx="222" cy="56" r="4" fill="#38bdf8"/>
    <circle cx="342" cy="56" r="4" fill="#38bdf8"/>
  </g>

  <!-- Gram Comparison Boxes -->
  <g transform="translate(45, 195)">
    <!-- Gram Positif Box -->
    <rect x="0" y="0" width="195" height="70" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="8" fill="#6366f1"/>
    <text x="20" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">+</text>
    <text x="35" y="23" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Gram-Positif</text>
    <text x="12" y="45" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="9.5">Peptidoglikan tebal (20-80 nm)</text>
    <text x="12" y="58" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9">Menyerap kristal violet (Ungu)</text>

    <!-- Gram Negatif Box -->
    <rect x="215" y="0" width="195" height="70" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="235" cy="20" r="8" fill="#ef4444"/>
    <text x="235" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">-</text>
    <text x="250" y="23" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Gram-Negatif</text>
    <text x="227" y="45" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="9.5">Peptidoglikan tipis + membran luar</text>
    <text x="227" y="58" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">Menyerap safranin (Merah/Pink)</text>
  </g>

  <!-- Bottom Info Callout -->
  <rect x="45" y="282" width="410" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="301" r="8" fill="#f59e0b"/>
  <text x="65" y="305" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🛡️</text>
  <text x="83" y="298" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Fungsi Utama:</text>
  <text x="83" y="311" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Memberikan bentuk sel kaku &amp; mencegah lisis akibat tekanan osmosis hipotonik.</text>
</svg>
