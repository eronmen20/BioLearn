<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="filamentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="560" height="350" rx="16" fill="url(#bgGradFla)"/>

  <!-- Title Badge (Top-Left) -->
  <rect x="25" y="18" width="190" height="26" rx="13" fill="#0c4a6e" opacity="0.9"/>
  <text x="120" y="35" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FLAGELA &amp; MOTOR BASAL</text>

  <!-- Left Side Labels (Safe margins, not cut off) -->
  <g transform="translate(130, 80)">
    <!-- Dinding Sel Label & Line -->
    <text x="-15" y="46" text-anchor="end" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Dinding Sel</text>
    <line x1="-10" y1="42" x2="0" y2="42" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Membran Plasma Label & Line -->
    <text x="-15" y="92" text-anchor="end" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Membran Plasma</text>
    <line x1="-10" y1="88" x2="0" y2="88" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Envelope Layers -->
    <!-- Outer Layer: Cell Wall -->
    <rect x="0" y="30" width="80" height="24" rx="4" fill="#d97706" opacity="0.85"/>
    <!-- Periplasmic space -->
    <rect x="0" y="54" width="80" height="20" rx="2" fill="#334155" opacity="0.5"/>
    <!-- Inner Layer: Plasma Membrane -->
    <rect x="0" y="74" width="80" height="26" rx="4" fill="#4338ca" opacity="0.85"/>

    <!-- Basal Apparatus (Motor & Rings) -->
    <!-- Shaft / Rod -->
    <rect x="30" y="25" width="20" height="75" rx="3" fill="#64748b"/>
    <!-- L & P Rings (Outer) -->
    <ellipse cx="40" cy="38" rx="24" ry="6" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="40" cy="54" rx="22" ry="6" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <!-- M & S Rings (Inner membrane motor) -->
    <ellipse cx="40" cy="80" rx="23" ry="7" fill="#818cf8" stroke="#312e81" stroke-width="1.5"/>
    <ellipse cx="40" cy="95" rx="26" ry="7" fill="#6366f1" stroke="#312e81" stroke-width="1.5"/>

    <!-- Hook (Kait) -->
    <path d="M 30,25 C 30,-2 65,-12 90,5 C 105,15 110,30 120,35" fill="none" stroke="url(#hookGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Filament (Long undulating propeller) -->
    <path d="M 120,35 C 155,55 185,-5 225,25 S 295,75 340,15 S 380,25 405,5" fill="none" stroke="url(#filamentGrad)" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Rotation arrows on filament -->
    <path d="M 165,15 A 14,14 0 1,1 165,45" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="167,15 173,9 175,18" fill="#f472b6"/>
  </g>

  <!-- Labels for Parts (Safely positioned) -->
  <!-- Hook Label -->
  <g transform="translate(260, 60)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#db2777" stroke-width="1"/>
    <text x="47" y="17" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Kait (Hook)</text>
  </g>

  <!-- Filament Label -->
  <g transform="translate(370, 95)">
    <rect x="0" y="0" width="135" height="38" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Filamen Flagelin</text>
    <text x="67" y="30" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Baling-baling berputar 360°</text>
  </g>

  <!-- Motor Basal Label -->
  <g transform="translate(195, 205)">
    <rect x="0" y="0" width="135" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Badan Basal (Motor)</text>
    <text x="67" y="30" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Digerakkan arus ion proton (H+)</text>
  </g>

  <!-- Bottom Info Callout -->
  <rect x="25" y="285" width="510" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="48" cy="306" r="9" fill="#0284c7"/>
  <text x="48" y="310" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">🏊</text>
  <text x="68" y="302" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">Mekanisme Motilitas:</text>
  <text x="68" y="317" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Motor berputar cepat memberikan dorongan lari &amp; jungkir (run and tumble) menuju nutrisi.</text>
</svg>
