<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bloodBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="70%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <!-- Gradien Eritrosit (Cekung di Tengah / Bikonkaf) -->
    <radialGradient id="rbcGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
  </defs>

  <!-- Latar Belakang Plasma Darah Pucat -->
  <rect width="1000" height="1000" fill="url(#bloodBg)"/>

  <!-- Kumpulan Eritrosit (Sel Darah Merah) Berlimpah -->
  <g>
    <!-- Grid eritrosit dengan variasi rotasi dan cekungan -->
    <!-- Baris 1 -->
    <g transform="translate(100, 100)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(220, 80)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(340, 120)"><circle cx="0" cy="0" r="43" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="19" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(480, 90)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(620, 110)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(760, 80)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(890, 120)"><circle cx="0" cy="0" r="43" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="19" fill="#fda4af" opacity="0.8"/></g>

    <!-- Baris 2 -->
    <g transform="translate(80, 240)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(200, 220)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(680, 220)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(820, 240)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(930, 250)"><circle cx="0" cy="0" r="39" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="16" fill="#fda4af" opacity="0.8"/></g>

    <!-- Baris 3 -->
    <g transform="translate(140, 360)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(260, 380)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(740, 360)"><circle cx="0" cy="0" r="43" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="19" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(870, 380)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>

    <!-- Baris 4 -->
    <g transform="translate(90, 500)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(220, 520)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(780, 500)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(910, 520)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>

    <!-- Baris 5 -->
    <g transform="translate(130, 640)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(280, 660)"><circle cx="0" cy="0" r="43" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="19" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(420, 680)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(720, 640)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(860, 660)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>

    <!-- Baris 6 -->
    <g transform="translate(100, 780)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(230, 800)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(370, 820)"><circle cx="0" cy="0" r="41" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(510, 800)"><circle cx="0" cy="0" r="43" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="19" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(650, 820)"><circle cx="0" cy="0" r="40" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="17" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(790, 800)"><circle cx="0" cy="0" r="42" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="18" fill="#fda4af" opacity="0.8"/></g>
    <g transform="translate(920, 820)"><circle cx="0" cy="0" r="39" fill="url(#rbcGrad)"/><circle cx="0" cy="0" r="16" fill="#fda4af" opacity="0.8"/></g>
  </g>

  <!-- ================= LEUKOSIT 1: NEUTROFIL (TENGAH KIRI - 440, 320) ================= -->
  <!-- Sel Darah Putih Terbanyak: Sitoplasma Merah Muda dengan Inti 3-5 Lobus Terhubung -->
  <g id="neutrophil" transform="translate(440, 320)">
    <!-- Badan Sel -->
    <circle cx="0" cy="0" r="75" fill="#fbcfe8" stroke="#f472b6" stroke-width="4" opacity="0.9"/>
    <!-- Granula Halus -->
    <g fill="#db2777" opacity="0.3">
      <circle cx="-35" cy="-25" r="3"/><circle cx="-20" cy="-45" r="2.5"/><circle cx="15" cy="-35" r="3"/>
      <circle cx="45" cy="-15" r="2.5"/><circle cx="-40" cy="25" r="3"/><circle cx="35" cy="35" r="2.5"/>
    </g>
    <!-- Inti Berlobus Khas (Polymorphonuclear / 3 Lobus Ungu Gelap) -->
    <g fill="#581c87" stroke="#3b0764" stroke-width="2">
      <!-- Lobus 1 -->
      <circle cx="-28" cy="-22" r="20"/>
      <!-- Jembatan kromatin 1-2 -->
      <path d="M-15,-15 Q0,-30 18,-20" stroke="#3b0764" stroke-width="7" fill="none"/>
      <!-- Lobus 2 -->
      <circle cx="25" cy="-18" r="22"/>
      <!-- Jembatan kromatin 2-3 -->
      <path d="M22,0 Q30,25 5,28" stroke="#3b0764" stroke-width="7" fill="none"/>
      <!-- Lobus 3 -->
      <circle cx="0" cy="30" r="22"/>
    </g>
  </g>

  <!-- ================= LEUKOSIT 2: LIMFOSIT (TENGAH KANAN - 560, 520) ================= -->
  <!-- Inti Bulat Besar Hampir Memenuhi Seluruh Sitoplasma -->
  <g id="lymphocyte" transform="translate(560, 500)">
    <!-- Badan Sel -->
    <circle cx="0" cy="0" r="62" fill="#c4b5fd" stroke="#a78bfa" stroke-width="3" opacity="0.85"/>
    <!-- Inti Besar Spherical Ungu Pekat -->
    <circle cx="2" cy="0" r="50" fill="#4c1d95" stroke="#2e1065" stroke-width="3"/>
    <circle cx="-12" cy="-12" r="8" fill="#6d28d9" opacity="0.6"/>
  </g>

  <!-- ================= TROMBOSIT (KEPING DARAH - KECIL SEKALI) ================= -->
  <g fill="#7e22ce" stroke="#581c87" stroke-width="1.5">
    <!-- Trombosit 1 -->
    <path d="M340,480 Q346,472 352,482 Q358,490 350,494 Q342,492 340,480 Z"/>
    <circle cx="362" cy="488" r="4"/>
    <!-- Trombosit 2 -->
    <path d="M680,420 Q688,414 694,424 Q700,432 690,436 Q682,434 680,420 Z"/>
    <circle cx="672" cy="428" r="4.5"/>
    <!-- Trombosit 3 -->
    <circle cx="510" cy="650" r="5"/>
    <circle cx="522" cy="656" r="4"/>
  </g>
</svg>
