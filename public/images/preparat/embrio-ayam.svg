<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="eggLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
  </defs>

  <!-- Latar Kuning Telur Transparan Mikroskopis -->
  <rect width="1000" height="1000" fill="url(#eggLight)"/>

  <!-- Area Vaskulosa & Pembuluh Vitellin (Merah Darah) -->
  <g stroke="#e11d48" fill="none" opacity="0.65" stroke-linecap="round">
    <!-- Pembuluh kiri -->
    <path d="M460,520 Q360,500 240,460 Q140,420 80,480" stroke-width="8"/>
    <path d="M360,500 Q300,420 180,380" stroke-width="5"/>
    <path d="M300,510 Q220,560 140,580" stroke-width="5"/>
    <path d="M220,560 Q180,640 100,660" stroke-width="4"/>

    <!-- Pembuluh kanan -->
    <path d="M540,520 Q640,500 760,460 Q860,420 920,480" stroke-width="8"/>
    <path d="M640,500 Q700,420 820,380" stroke-width="5"/>
    <path d="M700,510 Q780,560 860,580" stroke-width="5"/>
    <path d="M780,560 Q820,640 900,660" stroke-width="4"/>

    <!-- Cabang Halus Kapiler -->
    <path d="M240,460 Q200,480 160,460" stroke-width="3"/>
    <path d="M760,460 Q800,480 840,460" stroke-width="3"/>
    <path d="M180,380 Q140,360 110,340" stroke-width="3"/>
    <path d="M820,380 Q860,360 890,340" stroke-width="3"/>
  </g>

  <!-- Tubuh Embrio Ayam (Bentuk Melengkung C Khas Umur 48-72 Jam) -->
  <g fill="#fed7aa" stroke="#c2410c" stroke-width="4" opacity="0.95">
    <!-- Kepala & Vesikula Otak -->
    <!-- Prosensefalon / Telensefalon -->
    <path d="M500,160 C420,160 380,220 380,280 C380,340 430,370 470,390 C480,420 480,460 490,520 C500,580 500,640 500,700 C500,760 480,820 450,860 C480,870 530,860 540,810 C550,750 550,680 545,610 C540,540 550,470 560,430 C600,400 640,340 640,270 C640,200 580,160 500,160 Z"
          fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  </g>

  <!-- Vesikula Otak (Brain Vesicles) -->
  <g stroke="#9a3412" stroke-width="3" fill="#fdba74" opacity="0.6">
    <!-- Forebrain -->
    <ellipse cx="450" cy="240" rx="40" ry="50" transform="rotate(-15 450 240)"/>
    <!-- Midbrain (Mesensefalon) -->
    <ellipse cx="510" cy="190" rx="55" ry="35"/>
    <!-- Hindbrain (Rombensefalon) -->
    <ellipse cx="570" cy="240" rx="45" ry="55" transform="rotate(20 570 240)"/>
  </g>

  <!-- Bakal Mata (Cawan Optik & Lensa) -->
  <g>
    <circle cx="430" cy="250" r="22" fill="#7c2d12" stroke="#431407" stroke-width="3"/>
    <circle cx="432" cy="248" r="9" fill="#0f172a"/>
    <circle cx="435" cy="246" r="3" fill="#ffffff"/>
  </g>

  <!-- Tabung Jantung (Bulbus cordis & Ventrikel - Melengkung di Ventral) -->
  <g>
    <path d="M480,400 C440,410 420,440 430,470 C440,500 480,510 500,470 C510,450 510,420 480,400 Z"
          fill="#be123c" stroke="#881337" stroke-width="4"/>
    <circle cx="460" cy="455" r="14" fill="#e11d48"/>
  </g>

  <!-- Tabung Saraf (Neural Tube) Sepanjang Punggung -->
  <path d="M510,220 C530,300 525,440 520,540 C515,640 515,740 490,840"
        fill="none" stroke="#c2410c" stroke-width="5"/>

  <!-- Deretan Somit (Somites - Balok-Balok Mesoderm Sepanjang Sumbu Tubuh) -->
  <g stroke="#ea580c" stroke-width="2" fill="#fed7aa">
    <!-- Baris Kiri Somit -->
    <rect x="495" y="470" width="16" height="12" rx="3"/>
    <rect x="496" y="490" width="16" height="12" rx="3"/>
    <rect x="497" y="510" width="16" height="12" rx="3"/>
    <rect x="497" y="530" width="16" height="12" rx="3"/>
    <rect x="498" y="550" width="16" height="12" rx="3"/>
    <rect x="498" y="570" width="16" height="12" rx="3"/>
    <rect x="498" y="590" width="16" height="12" rx="3"/>
    <rect x="497" y="610" width="16" height="12" rx="3"/>
    <rect x="496" y="630" width="16" height="12" rx="3"/>
    <rect x="495" y="650" width="16" height="12" rx="3"/>
    <rect x="493" y="670" width="16" height="12" rx="3"/>
    <rect x="490" y="690" width="16" height="12" rx="3"/>
    <rect x="487" y="710" width="16" height="12" rx="3"/>
    <rect x="483" y="730" width="16" height="12" rx="3"/>
    <rect x="478" y="750" width="16" height="12" rx="3"/>
    <rect x="473" y="770" width="15" height="12" rx="3"/>
    <rect x="468" y="790" width="15" height="12" rx="3"/>
    <rect x="462" y="810" width="14" height="12" rx="3"/>

    <!-- Baris Kanan Somit -->
    <rect x="525" y="470" width="16" height="12" rx="3"/>
    <rect x="526" y="490" width="16" height="12" rx="3"/>
    <rect x="527" y="510" width="16" height="12" rx="3"/>
    <rect x="527" y="530" width="16" height="12" rx="3"/>
    <rect x="528" y="550" width="16" height="12" rx="3"/>
    <rect x="528" y="570" width="16" height="12" rx="3"/>
    <rect x="528" y="590" width="16" height="12" rx="3"/>
    <rect x="527" y="610" width="16" height="12" rx="3"/>
    <rect x="526" y="630" width="16" height="12" rx="3"/>
    <rect x="525" y="650" width="16" height="12" rx="3"/>
    <rect x="523" y="670" width="16" height="12" rx="3"/>
    <rect x="520" y="690" width="16" height="12" rx="3"/>
    <rect x="517" y="710" width="16" height="12" rx="3"/>
    <rect x="513" y="730" width="16" height="12" rx="3"/>
    <rect x="508" y="750" width="16" height="12" rx="3"/>
    <rect x="503" y="770" width="15" height="12" rx="3"/>
    <rect x="498" y="790" width="15" height="12" rx="3"/>
    <rect x="492" y="810" width="14" height="12" rx="3"/>
  </g>
</svg>
